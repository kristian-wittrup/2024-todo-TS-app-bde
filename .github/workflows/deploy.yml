name: Deploy app

# Publish after changes reach main.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Run one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run unit tests
        run: npx vitest run src/progress.test.ts

      - name: Run browser tests
        run: >
          npx testcafe chrome:headless "test/*.js"
          --app "npm run dev -- --port 5173 --strictPort"
          --app-init-delay 5000

      # Save the built files for the deployment job.
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Publish only when the build and tests pass.
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5